
exec-once = hypridle

################
### MONITORS ###
################

# See https://wiki.hyprland.org/Configuring/Monitors/
# ===== setup with home hdmi monitor and laptop screen =====
# monitor=HDMI-A-1,1920x1080@100.00Hz,0x0,1 # Primary monitor- HDMI
# monitor=eDP-1,1920x1200@60.00Hz,1920x600,1 # Laptop monitor

# ===== setup with docking station and laptop screen =====
monitor=DP-1,1920x1080@60.00Hz,0x0,1 # Primary monitor- Docking station
monitor=eDP-1,1920x1200@60.00Hz,1920x190,1 # Laptop monitor

# ===== setup with work hdmi monitor and laptop screen =====
# monitor=HDMI-A-1,1920x1080@60.00Hz,1920x0,1
# monitor=eDP-1,1920x1200@60.00Hz,0x600,1

# monitor= , preferred, auto, 1


##################
### WORKSPACES ###
##################

# Ref https://wiki.hyprland.org/Configuring/Workspace-Rules/
# "Smart gaps" / "No gaps when only"
# uncomment all if you wish to use that.
# workspace = w[tv1], gapsout:0, gapsin:0
# workspace = f[1], gapsout:0, gapsin:0
# windowrule = bordersize 0, floating:0, onworkspace:w[tv1]
# windowrule = rounding 0, floating:0, onworkspace:w[tv1]
# windowrule = bordersize 0, floating:0, onworkspace:f[1]
# windowrule = rounding 0, floating:0, onworkspace:f[1]
workspace=1,  monitor:eDP-1
workspace=3,  monitor:eDP-1
workspace=5,  monitor:eDP-1
workspace=7,  monitor:eDP-1
workspace=9,  monitor:eDP-1

# workspace=2,  monitor:HDMI-A-1
# workspace=4,  monitor:HDMI-A-1
# workspace=6,  monitor:HDMI-A-1
# workspace=8,  monitor:HDMI-A-1
# workspace=10,  monitor:HDMI-A-1
workspace=2,  monitor:DP-1
workspace=4,  monitor:DP-1
workspace=6,  monitor:DP-1
workspace=8,  monitor:DP-1
workspace=10,  monitor:DP-1
