###################
### MY PROGRAMS ###
###################

# See https://wiki.hyprland.org/Configuring/Keywords/


#################
### AUTOSTART ###
#################

# Autostart necessary processes (like notifications daemons, status bars, etc.)
# Or execute your favorite apps at launch like this:

# exec-once = $terminal
exec-once = nm-applet
# exec-once = waybar & hyprpaper & firefox
# waybar- top bar, swaync- notification daemon
exec-once = swaync
# exec-once = ~/.local/bin/waybar-launch.sh
exec-once = swww-daemon
exec-once = quickshell

# auto mounting and file management
exec-once = lxqt-policykit-agent
exec-once = udiskie --tray
exec-once = thunar --daemon

# clipboard manager
exec-once = clipse -listen

# keyring
exec-once = /usr/bin/gnome-keyring-daemon --start --components=pkcs11,secrets,ssh,gpg


#############################
### ENVIRONMENT VARIABLES ###
#############################

# See https://wiki.hyprland.org/Configuring/Environment-variables/

env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24
env = WEZTERM_CONFIG_FILE,$HOME/.config/wezterm/init.lua
env = QT_QPA_PLATFORMTHEME,qt6ct


